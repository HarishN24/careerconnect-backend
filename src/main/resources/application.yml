server:
  port: 8080

spring:
  application:
    name: careerconnect-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careerconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  mail:
   host: smtp.gmail.com
   port: 587
   username: ${MAIL_USERNAME:}
   password: ${MAIL_PASSWORD:}
   properties:
     mail:
       smtp:
        auth: true
        starttls:
          enable: true
        connectiontimeout: 2000
        timeout: 3000
        writetimeout: 3000

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${MAIL_FROM:onboarding@resend.dev}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevOnlySecretKeyPleaseChangeInProdEnvironment123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
